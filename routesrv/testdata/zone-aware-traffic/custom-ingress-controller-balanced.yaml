apiVersion: v1
kind: Service
metadata:
  labels:
    app: my-custom-ingress
  name: my-custom-ingress
  namespace: custom-ns
spec:
  clusterIP: 10.3.190.98
  ports:
    - name: web
      port: 80
      protocol: TCP
      targetPort: 9090
  selector:
    app: my-custom-ingress
  type: ClusterIP
---
apiVersion: v1
kind: EndpointSlice
metadata:
  labels:
    kubernetes.io/service-name: my-custom-ingress
  name: my-custom-ingress-foo
  namespace: custom-ns
endpoints:
  - addresses:
    - 10.9.5.1
    zone: eu-central-1a
  - addresses:
    - 10.9.5.2
    zone: eu-central-1b
  - addresses:
    - 10.9.5.3
    zone: eu-central-1c
ports:
  - name: web
    port: 9090
    protocol: TCP
